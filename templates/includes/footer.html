{% load i18n static %}
<!-- Footer -->
<footer class="bg-white border-t py-4 px-6">
    <div class="flex flex-col md:flex-row items-center justify-between">
        <div class="flex items-center space-x-4 mb-4 md:mb-0">
            <p class="text-sm text-gray-500">
                &copy; {{ now|date:"Y" }} {{ company_name }}. 
                {% trans 'All rights reserved.' %}
            </p>
            {% if app_config %}
            <p class="text-sm text-gray-500">{{ app_config.version }}</p>
            {% endif %}
        </div>
        <div class="flex items-center space-x-4">
            <a href="#" class="text-sm text-gray-500 hover:text-primary-600">{% trans 'Privacy Policy' %}</a>
            <a href="#" class="text-sm text-gray-500 hover:text-primary-600">{% trans 'Terms of Service' %}</a>
            <a href="#" class="text-sm text-gray-500 hover:text-primary-600">{% trans 'Help' %}</a>
        </div>
    </div>
</footer>
