{% load i18n static %}
<!-- Header -->
<header class="bg-white shadow-sm border-b">
    <div class="flex items-center justify-between h-16 px-4 md:px-6 lg:px-8">
        <!-- Mobile Menu Button -->
        <button id="mobile-menu-button" class="md:hidden p-2 rounded-lg hover:bg-gray-100">
            <i class="fas fa-bars text-gray-600"></i>
        </button>
        
        <!-- Search Bar -->
        <div class="flex-1 max-w-md mx-4">
            <div class="relative">
                <input type="text" 
                       id="global-search" 
                       placeholder="{% trans 'Search...' %}" 
                       class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
            </div>
        </div>
        
        <!-- Header Actions -->
        <div class="flex items-center space-x-2">
            <!-- Notifications -->
            <button class="p-2 rounded-lg hover:bg-gray-100 relative">
                <i class="fas fa-bell text-gray-600"></i>
                <span class="absolute -top-1 -right-1 h-4 w-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">5</span>
            </button>
            
            <!-- Language Switcher -->
            <div class="relative">
                <button id="language-toggle" class="p-2 rounded-lg hover:bg-gray-100">
                    <i class="fas fa-globe text-gray-600"></i>
                </button>
                <div id="language-menu" class="hidden absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-lg border py-1 z-50">
                    <a href="?language=fr" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Français</a>
                    <a href="?language=en" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">English</a>
                    <a href="?language=ar" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">العربية</a>
                </div>
            </div>
            
            <!-- User Menu -->
            <div class="relative">
                <button id="user-menu-toggle" class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100">
                    {% if request.user.avatar %}
                    <img src="{{ request.user.avatar.url }}" alt="{{ request.user.username }}" class="h-8 w-8 rounded-full object-cover">
                    {% else %}
                    <div class="h-8 w-8 bg-primary-500 rounded-full flex items-center justify-center">
                        <i class="fas fa-user text-white text-sm"></i>
                    </div>
                    {% endif %}
                    <span class="hidden md:inline">{{ request.user.username }}</span>
                    <i class="fas fa-chevron-down text-xs"></i>
                </button>
                
                <div id="user-menu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border py-1 z-50">
                    <a href="{% url 'accounts:profile' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                        <i class="fas fa-user mr-2"></i>{% trans 'Profile' %}
                    </a>
                    <a href="{% url 'accounts:password_change' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                        <i class="fas fa-key mr-2"></i>{% trans 'Change Password' %}
                    </a>
                    <div class="border-t my-1"></div>
                    <a href="{% url 'accounts:logout' %}" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                        <i class="fas fa-sign-out-alt mr-2"></i>{% trans 'Logout' %}
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>
